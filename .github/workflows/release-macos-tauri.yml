# ─────────────────────────────────────────────────────────────────────────────
# 통합 재사용 워크플로우 — "여러 앱이 공유하는 단일 배포 저장소" 버전
#   경로: .github/workflows/release-macos-tauri.yml  (org 의 `.github` 저장소)
#
# 한 개의 public 저장소를 여러 앱이 함께 씁니다. 앱마다 **고정 태그**(app-slug)로
# 자기 Release 를 하나씩 갖고, 업데이터는 그 고정 태그를 직접 가리킵니다.
#   → GitHub 의 `/releases/latest/` 별칭을 안 쓰므로 앱끼리 안 섞입니다.
#
# 업데이터 엔드포인트(앱별로 고정):
#   https://github.com/<release-repo>/releases/download/<app-slug>/latest.json
# ─────────────────────────────────────────────────────────────────────────────
name: release-macos-tauri (reusable, shared repo)

on:
  workflow_call:
    inputs:
      release-repo:
        description: "여러 앱이 공유하는 public 배포 저장소 (예: son-develop/app-releases)"
        required: true
        type: string
      app-slug:
        description: "이 앱의 고정 식별자 = 고정 태그 = 엔드포인트 경로 (예: githand)"
        required: true
        type: string
      product-name:
        description: "릴리스 제목/노트에 쓸 앱 이름 (예: GitHand)"
        required: false
        type: string
        default: ""
      target:
        description: "Rust 타깃. 기본은 애플 실리콘"
        required: false
        type: string
        default: "aarch64-apple-darwin"
      frontend-build:
        description: "프런트엔드 빌드 명령"
        required: false
        type: string
        default: "npm ci && npm run build"
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      RELEASE_TOKEN:            # 공유 배포 저장소에 contents:write 권한을 가진 PAT
        required: true

jobs:
  build-and-publish:
    # 자가호스팅 러너 사용. ⚠️ macOS/애플실리콘 러너에 걸려야 합니다.
    # 다른 OS 자가호스팅 러너가 있으면 라벨로 고정하세요: [self-hosted, macOS, ARM64]
    runs-on: self-hosted
    steps:
      - name: Checkout source (this caller repo = private source)
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"     # v0.3.0 -> 0.3.0 (릴리스 노트/매니페스트용)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend
        run: ${{ inputs.frontend-build }}

      # tauri.conf.json 에 "bundle": { "createUpdaterArtifacts": true } 필요(v2)
      - name: Build & sign Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ inputs.target }}

      - name: Collect updater artifacts + build latest.json
        id: pack
        env:
          RELEASE_REPO: ${{ inputs.release-repo }}
          APP_SLUG: ${{ inputs.app-slug }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRODUCT: ${{ inputs.product-name }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${TARGET}/release/bundle/macos"
          TARGZ="$(ls "$BUNDLE_DIR"/*.app.tar.gz | head -n1)"
          SIG="${TARGZ}.sig"
          ASSET="$(basename "$TARGZ")"       # 예: GitHand.app.tar.gz

          case "$TARGET" in
            aarch64-apple-darwin) PLATFORM="darwin-aarch64" ;;
            x86_64-apple-darwin)  PLATFORM="darwin-x86_64"  ;;
            *) echo "Unknown target $TARGET"; exit 1 ;;
          esac

          # url 은 이 앱의 "고정 태그" 를 가리킵니다 (/latest/ 별칭 안 씀).
          URL="https://github.com/${RELEASE_REPO}/releases/download/${APP_SLUG}/${ASSET}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SIGNATURE="$(cat "$SIG")"

          jq -n \
            --arg version "$VERSION" \
            --arg notes   "${PRODUCT} ${VERSION}" \
            --arg pub     "$PUB_DATE" \
            --arg plat    "$PLATFORM" \
            --arg sig     "$SIGNATURE" \
            --arg url     "$URL" \
            '{version:$version, notes:$notes, pub_date:$pub,
              platforms: { ($plat): { signature:$sig, url:$url } } }' \
            > latest.json

          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "targz=$TARGZ" >> "$GITHUB_OUTPUT"
          echo "sig=$SIG"     >> "$GITHUB_OUTPUT"
          cat latest.json

      # 앱별 고정 태그 Release 하나에 자산을 덮어씁니다(--clobber).
      # 앱마다 태그가 다르므로 한 저장소를 공유해도 서로 안 건드립니다.
      - name: Publish to shared release repo (fixed per-app tag)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPO: ${{ inputs.release-repo }}
          APP_SLUG: ${{ inputs.app-slug }}
          PRODUCT: ${{ inputs.product-name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$APP_SLUG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release edit "$APP_SLUG" --repo "$RELEASE_REPO" \
              --title "${PRODUCT} (latest)" --notes "${PRODUCT} ${VERSION}"
            gh release upload "$APP_SLUG" --repo "$RELEASE_REPO" --clobber \
              "${{ steps.pack.outputs.targz }}" "${{ steps.pack.outputs.sig }}" latest.json
          else
            # --latest=false : 저장소 전체 "Latest" 배지를 특정 앱이 차지하지 않게
            gh release create "$APP_SLUG" --repo "$RELEASE_REPO" --latest=false \
              --title "${PRODUCT} (latest)" --notes "${PRODUCT} ${VERSION}" \
              "${{ steps.pack.outputs.targz }}" "${{ steps.pack.outputs.sig }}" latest.json
          fi
